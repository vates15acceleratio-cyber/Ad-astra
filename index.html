<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ad astra">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Ad astra · Reprise</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#ffffff; --ink:#1c1d20; --muted:#6b6e76; --line:#e3e1db;
    --accent:#1f6f5c; --accent-ink:#ffffff; --warn:#b4531a; --danger:#b3261e; --ok:#2e7d4f;
    --c1:#1f6f5c; --c2:#c2662d; --c3:#3b5ea8;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141517; --card:#1d1f22; --ink:#ececec; --muted:#9a9da5; --line:#2e3035;
      --accent:#4fb99a; --accent-ink:#0d1a16; --warn:#e08a4f; --danger:#f0776f; --ok:#6cc58c;
      --c1:#4fb99a; --c2:#e08a4f; --c3:#7d9ee0; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:18px 16px 8px;max-width:920px;margin:0 auto}
  h1{font-size:1.25rem;margin:0}
  .sub{color:var(--muted);font-size:.9rem}
  nav{display:flex;gap:6px;max-width:920px;margin:8px auto 0;padding:0 16px;overflow-x:auto}
  nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
  nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  main{max-width:920px;margin:12px auto 48px;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:1.05rem;margin:0 0 8px}
  .card h3{font-size:.95rem;margin:14px 0 6px;color:var(--muted);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat b{display:block;font-size:1.4rem}
  .stat span{color:var(--muted);font-size:.82rem}
  ul.plan{margin:6px 0 0;padding-left:20px}
  ul.plan li{margin:3px 0}
  .tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-right:6px}
  .tag.ok{color:var(--ok);border-color:var(--ok)}
  .banner{border-radius:12px;padding:10px 12px;margin-bottom:12px;border:1px solid var(--warn);color:var(--warn);background:transparent}
  .banner.danger{border-color:var(--danger);color:var(--danger)}
  .banner.note{border-color:var(--line);color:var(--ink)}
  label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 3px}
  input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
  textarea{min-height:80px;resize:vertical}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  button.primary{margin-top:14px;background:var(--accent);color:var(--accent-ink);border:0;padding:10px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:10px;font:inherit;cursor:pointer}
  button.danger{border-color:var(--danger);color:var(--danger)}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600}
  .chart{width:100%;height:auto}
  .chart text{fill:var(--muted);font-size:11px}
  .empty{color:var(--muted);font-style:italic}
  .hidden{display:none}
  details summary{cursor:pointer;color:var(--accent);margin-top:8px}
  small{color:var(--muted)}

  header{padding-top:max(18px, env(safe-area-inset-top))}
  main{padding-bottom:max(48px, env(safe-area-inset-bottom))}
  nav button, button.primary, button.ghost, input, select{min-height:44px}
  button.ghost{min-width:44px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #update-banner{display:flex;gap:10px;align-items:center;justify-content:space-between;width:calc(100% - 32px);max-width:888px;margin:8px auto 0}
  #update-banner.hidden{display:none}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <h1>Reprise · Ad astra</h1>
  <div class="sub" id="subtitle"></div>
</header>
<div id="update-banner" class="banner note hidden" role="status"><span>Une nouvelle version est prête.</span><button class="ghost" id="update-go" type="button">Relancer</button></div>
<nav role="tablist" id="tabs"></nav>
<main id="view"></main>
<noscript><p style="padding:16px">Cette appli a besoin de JavaScript pour fonctionner.</p></noscript>
<script src="app.js"></script>
</body>
</html>
