<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ad astra">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e14">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="cinzel-700-latin.woff2" crossorigin>
<link rel="preload" as="image" href="figure.svg">
<title>Ad astra · Reprise</title>
<style>
@font-face{font-family:"Cinzel";font-weight:700;font-display:swap;src:url(cinzel-700-latin.woff2) format("woff2")}
:root{
  --bg:#0a0e14; --surface:#161b22; --surface-2:#1f262f; --surface-3:#2a323d;
  --border:#2d3744; --border-strong:#404a59;
  --text:#e6edf3; --text-dim:#9ba6b3; --text-muted:#7d8896;
  --accent:#f5d76e; --accent-2:#ffe38f; --accent-dim:#a8924a; --accent-soft:#f5d76e22; --accent-ink:#1a1500;
  --success:#3fb950; --success-soft:#3fb95022; --danger:#f85149; --danger-soft:#f8514922;
  --warn:#e3a13a; --warn-soft:#e3a13a22; --info:#58a6ff; --info-soft:#58a6ff22;
  --c1:#f5d76e; --c2:#58a6ff; --c3:#3fb950; --c4:#f0883e;
  --elev-1:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.28);
  --elev-2:0 2px 4px rgba(0,0,0,.4),0 14px 32px rgba(0,0,0,.4);
  --glow:0 4px 18px rgba(245,215,110,.16);
  --radius:14px; --radius-sm:10px;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --font-title:"Cinzel",Georgia,serif;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font-sans);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 85% -120px,rgba(245,215,110,.07),transparent 60%),radial-gradient(900px 400px at 0% 0%,rgba(88,166,255,.05),transparent 60%);
  background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;flex:none}
.ic.sm{width:18px;height:18px}
.hidden{display:none!important}

/* ===== Écran d'accueil ===== */
#splash{position:fixed;inset:0;z-index:1000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  transition:transform .55s cubic-bezier(.7,0,.3,1);animation:splashGone 0s 4.5s forwards}
#splash.leaving{transform:translateY(-100%)}
@keyframes splashGone{to{visibility:hidden}}
.sp-stars{position:absolute;inset:0;pointer-events:none}
.sp-stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.55)}
.sp-stars i.g{background:var(--accent-2);box-shadow:0 0 8px 1px rgba(245,215,110,.7)}
.sp-stars i.t{animation:twinkle 2.4s ease-in-out infinite alternate}
@keyframes twinkle{from{transform:scale(1)}to{transform:scale(2.2)}}
.sp-fig{position:relative;width:min(86vw,440px);aspect-ratio:440/420;animation:streak 1.5s cubic-bezier(.16,.84,.3,1) both}
.sp-fig img{width:100%;height:100%;display:block}
@keyframes streak{from{transform:translate(55vw,-45vh) scale(.5)}to{transform:none}}
.sp-title{font-family:var(--font-title);font-weight:700;letter-spacing:.32em;font-size:clamp(26px,8vw,40px);color:var(--accent);margin-top:-6px;padding-left:.32em;
  background:linear-gradient(180deg,#fff2b8,#f5d76e 55%,#a8924a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-transform:uppercase}
.sp-motto{font-family:var(--font-title);font-weight:700;letter-spacing:.22em;font-size:clamp(10px,3vw,13px);color:var(--text-dim);margin-top:10px;padding-left:.22em;text-transform:uppercase;text-align:center}
.sp-made{position:absolute;left:0;right:0;bottom:calc(22px + var(--safe-bottom));text-align:center;font-family:var(--font-title);font-weight:700;letter-spacing:.2em;font-size:10px;color:var(--text-muted);text-transform:uppercase}
@media (prefers-reduced-motion:reduce){
  #splash{transition:none;animation:splashGone 0s 2.5s forwards}
  .sp-fig{animation:none}.sp-stars i.t{animation:none}
}

/* ===== Squelette ===== */
.app-header{position:sticky;top:0;z-index:50;background:rgba(10,14,20,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:calc(10px + var(--safe-top)) 16px 10px}
.app-header .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;flex:none}
.brand{font-family:var(--font-title);font-weight:700;letter-spacing:.16em;font-size:17px;text-transform:uppercase;
  background:linear-gradient(180deg,#fff2b8,#f5d76e 60%,#a8924a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.sub{color:var(--text-dim);font-size:13px;margin-top:2px}
#update-banner{display:flex;gap:10px;align-items:center;justify-content:space-between;max-width:728px;margin:10px auto 0;padding:10px 14px;
  border:1px solid var(--accent-dim);background:var(--accent-soft);border-radius:var(--radius-sm);width:calc(100% - 32px)}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + var(--safe-bottom) + 28px)}
.view-enter{animation:viewIn .22s ease-out}
@keyframes viewIn{from{transform:translateY(8px)}to{transform:none}}

#tabs{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;gap:2px;background:rgba(22,27,34,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--border);padding:6px 6px calc(6px + var(--safe-bottom));height:calc(var(--nav-h) + var(--safe-bottom))}
#tabs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-muted);
  font-size:10.5px;font-weight:500;border-radius:12px;transition:background .15s,color .15s}
#tabs button .ic{width:22px;height:22px}
#tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
#tabs button:active{background:var(--surface-2)}
@media (min-width:900px){
  #tabs{top:0;bottom:0;right:auto;width:92px;flex-direction:column;justify-content:flex-start;gap:6px;padding:90px 8px 8px;height:auto;border-top:0;border-right:1px solid var(--border)}
  #tabs button{flex:none;height:64px}
  .app-header .in,main,#update-banner{margin-left:max(108px,calc(50vw - 380px + 46px))}
  main{padding-bottom:40px}
}

/* ===== Cartes & typographie ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--elev-1)}
.card h2{font-size:16px;font-weight:650;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .ic{color:var(--accent)}
.card h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin:18px 0 8px}
.card p{color:var(--text-dim);margin:6px 0}
.card p b{color:var(--text)}
small,.small{color:var(--text-muted);font-size:12.5px;line-height:1.5;display:block;margin-top:8px}
.empty{color:var(--text-muted);font-style:italic;padding:8px 0}
code{font-family:var(--font-mono);font-size:.9em;background:var(--surface-2);padding:1px 6px;border-radius:6px}
.section-title{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin:22px 4px 10px}

.hero{position:relative;overflow:hidden;border:1px solid rgba(245,215,110,.28);border-radius:18px;padding:18px;margin-bottom:14px;
  background:linear-gradient(160deg,rgba(245,215,110,.14),rgba(245,215,110,.03) 55%),var(--surface);box-shadow:var(--elev-2)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(245,215,110,.22),transparent 70%);pointer-events:none}
.hero .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-dim);font-weight:600}
.hero h1{font-size:24px;line-height:1.2;margin:4px 0 2px;font-weight:700}
.hero .phase{color:var(--text-dim);font-size:14px}
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:14px}
.weeks span{height:8px;border-radius:4px;background:var(--surface-3);position:relative}
.weeks span.done{background:var(--accent-dim)}
.weeks span.now{background:var(--accent);box-shadow:0 0 10px rgba(245,215,110,.55)}
.weeks span.lite::after{content:"";position:absolute;left:50%;top:-5px;width:3px;height:3px;border-radius:50%;background:var(--info);transform:translateX(-50%)}
.weeks-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:6px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--elev-1)}
.stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.stat b em{font-style:normal;font-size:12px;color:var(--text-muted);font-weight:500;margin-left:3px}
.stat span{color:var(--text-muted);font-size:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text-dim);background:var(--surface-2)}
.tag.ok{color:var(--success);border-color:rgba(63,185,80,.45);background:var(--success-soft)}
.tag.info{color:var(--info);border-color:rgba(88,166,255,.4);background:var(--info-soft)}
.tag .ic{width:13px;height:13px}
.week-row{display:flex;gap:8px;margin-bottom:6px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim)}
.wk b{font-family:var(--font-mono);font-size:20px;color:var(--text)}
.wk span{font-size:11px}
.wk.ok{border-color:rgba(63,185,80,.5);background:var(--success-soft);color:var(--success)}
.wk.ok b{color:var(--success)}
.wk.next{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.wk.next b{color:var(--accent)}

.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;border:1px solid rgba(227,161,58,.5);background:var(--warn-soft);color:#f0c06e;font-size:14px}
.banner .ic{margin-top:1px}
.banner.danger{border-color:rgba(248,81,73,.55);background:var(--danger-soft);color:#ff8a84}
.banner.note{border-color:var(--border);background:var(--surface);color:var(--text)}
.banner.note .ic{color:var(--accent)}
.banner.note b{color:var(--accent)}
.banner.good{border-color:rgba(63,185,80,.45);background:var(--success-soft);color:#7ee08f}

.session-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.letter{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--accent);width:54px;height:54px;display:flex;align-items:center;justify-content:center;flex:none;
  background:linear-gradient(150deg,rgba(245,215,110,.22),rgba(245,215,110,.06));border:1px solid rgba(245,215,110,.32);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.session-head h2{margin:0;font-size:17px}
.session-head .meta{font-size:13px;color:var(--text-dim)}
ul.plan{list-style:none;margin:4px 0 0;padding:0}
ul.plan li{position:relative;padding:9px 0 9px 26px;border-top:1px solid var(--border);color:var(--text-dim);font-size:14.5px}
ul.plan li:first-child{border-top:0}
ul.plan li::before{content:"";position:absolute;left:4px;top:15px;width:9px;height:9px;transform:rotate(45deg);background:var(--accent-dim);border-radius:2px}
ol.steps{list-style:none;counter-reset:s;margin:4px 0 0;padding:0}
ol.steps li{counter-increment:s;position:relative;padding:9px 0 9px 36px;border-top:1px solid var(--border);color:var(--text-dim);font-size:14.5px}
ol.steps li:first-child{border-top:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:24px;height:24px;border-radius:50%;background:var(--surface-3);color:var(--accent);font:600 12px/24px var(--font-mono);text-align:center}
details.fold{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;box-shadow:var(--elev-1)}
details.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:600;min-height:48px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--text-muted);border-bottom:2px solid var(--text-muted);transform:rotate(45deg);transition:transform .2s}
details.fold[open] summary::after{transform:rotate(-135deg)}
details.fold .body{padding:0 16px 14px}

/* ===== Boutons & formulaires ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:11px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:15px;transition:transform .12s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.primary{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-ink);box-shadow:var(--glow);margin-top:14px}
.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);box-shadow:var(--elev-1);min-height:44px;padding:9px 14px;border-radius:var(--radius-sm)}
.ghost:active{background:var(--surface-3)}
.danger{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(248,81,73,.6)}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text-muted)}
.icon-btn:active{background:var(--surface-3);color:var(--danger)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.actions .primary{margin-top:0}
label,.lbl{display:block;font-size:12.5px;color:var(--text-dim);margin:12px 0 5px;font-weight:500}
input,select,textarea{width:100%;min-height:46px;font:inherit;font-size:16px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;outline:none}
input[type=file]{padding:10px;font-size:14px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface-3)}
textarea{min-height:84px;resize:vertical}
input[type=date]{color-scheme:dark}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0;pointer-events:none}
.seg label{margin:0;min-height:46px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:14px;cursor:pointer}
.seg input:checked+label{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.weekpick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scroll-snap-type:x proximity}
.weekpick button{flex:none;scroll-snap-align:center;min-width:64px;min-height:56px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.weekpick button b{font-family:var(--font-mono);font-size:17px;color:var(--text)}
.weekpick button span{font-size:10px;letter-spacing:.04em}
.weekpick button.cur{border-color:var(--info);}
.weekpick button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.weekpick button[aria-pressed="true"] b{color:var(--accent)}

/* ===== Listes & tableaux ===== */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.item:first-child{border-top:0}
.item .badge{width:40px;height:40px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font:700 16px var(--font-mono);color:var(--accent);background:var(--accent-soft);border:1px solid rgba(245,215,110,.25)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;font-size:14.5px}
.item .d{color:var(--text-dim);font-size:13px;overflow-wrap:anywhere}
.item .d .k{color:var(--text-muted)}

.day-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.dd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);text-transform:uppercase}
.dd i{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent-ink)}
.dd i .ic{width:16px;height:16px}
.dd.express i{background:var(--accent-dim);border-color:var(--accent-dim)}
.dd.full i{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(245,215,110,.4)}
.dd.today{color:var(--text)}
.dd.today i{border-color:var(--accent)}
.streak{display:flex;align-items:center;gap:14px}
.streak .n{font:700 40px/1 var(--font-mono);color:var(--accent)}
.streak .l{color:var(--text-dim);font-size:13px;line-height:1.3}
.bar{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent-dim),var(--accent))}
.kpi{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi b{font:700 30px/1 var(--font-mono);color:var(--text)}
.kpi span{color:var(--text-muted);font-size:13px}
.kpi .delta{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--success-soft);color:var(--success);border:1px solid rgba(63,185,80,.4)}
.kpi .delta.neg{background:var(--warn-soft);color:var(--warn);border-color:rgba(227,161,58,.45)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{fill:var(--text-muted);font-size:16px;font-family:var(--font-sans)}
.hist-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.hist-table th,.hist-table td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.hist-table th{color:var(--text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);transform:translate(-50%,200%);background:var(--surface-3);border:1px solid var(--accent-dim);color:var(--text);padding:11px 18px;border-radius:999px;box-shadow:var(--elev-2);z-index:300;font-size:14px;transition:transform .3s cubic-bezier(.2,.9,.3,1),visibility 0s .3s;visibility:hidden;max-width:90vw;display:flex;gap:8px;align-items:center;pointer-events:none}
#toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.3,1)}
#toast .ic{color:var(--accent);width:18px;height:18px}
@media (min-width:900px){#toast{bottom:24px}}

/* ===== Croquis, calage, bilans ===== */
ul.plan li.ex,ol.steps li.ex{padding:6px 0}
ul.plan li.ex::before,ol.steps li.ex::before{display:none}
ol.steps li.ex{padding-left:0}
.ex-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--text-dim);font-size:14.5px;min-height:56px;border-radius:12px}
.ex-btn:active{background:var(--surface-2)}
.thumb{flex:none;width:64px;height:64px;border-radius:12px;background:var(--bg);border:1px solid var(--border);overflow:hidden;display:block}
.thumb svg{width:100%;height:100%;display:block}
.ex-t{flex:1;min-width:0}
.sheet-back{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:88dvh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + var(--safe-bottom));animation:sheetUp .25s ease-out}
@keyframes sheetUp{from{transform:translateY(40px)}to{transform:none}}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:20px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sheet-h h2{font-size:17px}
.sheet-h .icon-btn{font-size:26px;line-height:1;color:var(--text)}
.poses{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.poses figure{margin:0;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:8px}
.pose-svg svg{width:100%;height:auto;display:block}
.poses figcaption{font-size:13px;color:var(--text-dim);margin-top:6px;text-align:center}
.calage{border:1px solid rgba(245,215,110,.3);background:linear-gradient(160deg,rgba(245,215,110,.1),rgba(245,215,110,.02));border-radius:12px;padding:12px 14px}
.calage p{margin:4px 0 6px;color:var(--text-dim);font-size:14px}
.calage ul.plan li{font-size:14px}
.calage ul.plan li b{color:var(--accent)}
.lbl-up{display:flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.lvl{padding:10px 0;border-top:1px solid var(--border)}
.lvl:first-of-type{border-top:0}
.lvl-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lvl-n{font:600 15px var(--font-mono);color:var(--text-dim);margin-top:4px}
.lvl-n b{color:var(--accent);font-size:20px}
.lvl-n span{font:400 12px var(--font-sans);color:var(--text-muted)}
.tag.warn{color:var(--warn);border-color:rgba(227,161,58,.5);background:var(--warn-soft)}
.badge.ok{color:var(--success);background:var(--success-soft);border-color:rgba(63,185,80,.4)}
.card.bilan{border-color:rgba(88,166,255,.45);background:linear-gradient(160deg,rgba(88,166,255,.1),transparent 60%),var(--surface)}

.slist{margin-top:8px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);color:var(--text-dim);font-size:14.5px}
.srow:first-child{border-top:0}
.srow.info{font-size:13.5px;color:var(--text-muted);padding:10px 0}
.srow.done .ex-t{color:var(--text-muted);text-decoration:line-through}
.ck{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--border-strong);background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--accent-ink)}
.srow.done .ck{background:var(--accent);border-color:var(--accent)}
.thumb-sm{width:52px;height:52px;padding:0;cursor:pointer}

/* ===== Illustrations d'exercices : boucle animée douce (glissement, jamais de variation d'opacité) ===== */
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.35);transform-origin:50% 55%}
.demo{margin:4px 0 10px}
.demo-view{overflow:hidden;border-radius:14px;background:var(--bg);border:1px solid var(--border);aspect-ratio:1/1}
.demo-track{display:flex;height:100%;width:calc(var(--n)*100%);animation:demo2 3.6s ease-in-out infinite}
.demo-track.n3{animation-name:demo3;animation-duration:5.4s}
.demo-track.paused{animation-play-state:paused}
.demo-track img{width:calc(100%/var(--n));height:100%;object-fit:contain;flex:none;display:block}
@keyframes demo2{0%,30%{transform:translateX(0)}50%,80%{transform:translateX(-50%)}100%{transform:translateX(0)}}
@keyframes demo3{0%,15%{transform:translateX(0)}28%,40%{transform:translateX(-33.3333%)}53%,65%{transform:translateX(-66.6667%)}78%,88%{transform:translateX(-33.3333%)}100%{transform:translateX(0)}}
.demo-ctl{display:flex;justify-content:flex-end;margin-top:6px}
.demo-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.demo-strip figure{margin:0;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:6px}
.demo-strip img{width:100%;height:auto;display:block;border-radius:8px}
.demo-strip figcaption{font-size:12.5px;color:var(--text-dim);margin-top:4px;text-align:center}
@media (prefers-reduced-motion:reduce){.demo-track{animation:none!important}.demo-ctl{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}#splash{animation:splashGone 0s 2.5s forwards!important}}
</style>
</head>
